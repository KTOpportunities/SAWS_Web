<section class="section-3">
  <div class="container">
    <div class="content">
      <div class="content-wrap">
        <section class="activity-page">
          <!-- Header -->
          <div class="page-header">
            <!-- <div class="header-left">
              <h2>Activity Logs</h2>
              <span>Total Records: {{ totalRecords }}</span>
            </div> -->

            <div class="header-right">
              <button class="export-btn" (click)="exportToExcel()">
                Export To Excel
              </button>
            </div>
          </div>

          <!-- Table -->
          <div class="table-card">
            <div class="table-scroll">
              <table
                mat-table
                [dataSource]="filteredData"
                class="activity-table"
              >
                <!-- ID -->
                <ng-container matColumnDef="activityLogId">
                  <th mat-header-cell *matHeaderCellDef>ID</th>
                  <td mat-cell *matCellDef="let row">
                    {{ row.activityLogId }}
                  </td>
                </ng-container>
                <!-- Full Name -->
                <ng-container matColumnDef="fullname">
                  <th mat-header-cell *matHeaderCellDef>Full Name</th>
                  <td mat-cell *matCellDef="let row">
                    {{ row.fullname }}
                  </td>
                </ng-container>

                <!-- User Role -->
                <ng-container matColumnDef="userrole">
                  <th mat-header-cell *matHeaderCellDef>Role</th>
                  <td mat-cell *matCellDef="let row">
                    {{ row.userrole }}
                  </td>
                </ng-container>
                <!-- Type -->
                <ng-container matColumnDef="activityType">
                  <th mat-header-cell *matHeaderCellDef>Type</th>
                  <td mat-cell *matCellDef="let row">
                    {{ row.activityType }}
                  </td>
                </ng-container>

                <!-- Description -->
                <ng-container matColumnDef="activityDescription">
                  <th mat-header-cell *matHeaderCellDef>Description</th>
                  <td mat-cell *matCellDef="let row">
                    {{ row.activityDescription }}
                  </td>
                </ng-container>

                <!-- User -->
                <ng-container matColumnDef="createdby_aspnetusername">
                  <th mat-header-cell *matHeaderCellDef>User</th>
                  <td mat-cell *matCellDef="let row">
                    {{ row.createdby_aspnetusername }}
                  </td>
                </ng-container>

                <!-- Device -->
                <!-- <ng-container matColumnDef="deviceType">
                  <th mat-header-cell *matHeaderCellDef>Device</th>
                  <td mat-cell *matCellDef="let row">
                    {{ row.deviceType }}
                  </td>
                </ng-container> -->

                <!-- Browser -->
                <!-- <ng-container matColumnDef="browserName">
                  <th mat-header-cell *matHeaderCellDef>Browser</th>
                  <td mat-cell *matCellDef="let row">
                    {{ row.browserName }}
                  </td>
                </ng-container> -->

                <!-- Date -->
                <ng-container matColumnDef="created_at">
                  <th mat-header-cell *matHeaderCellDef>Date</th>
                  <td mat-cell *matCellDef="let row">
                    {{ row.created_at | date: "medium" }}
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

                <tr
                  mat-row
                  *matRowDef="let row; columns: displayedColumns"
                ></tr>
              </table>
            </div>

            <mat-paginator
              [length]="totalRecords"
              [pageSize]="pageSize"
              [pageSizeOptions]="[5, 10, 20]"
              (page)="onPageChange($event)"
            >
            </mat-paginator>
          </div>
        </section>
      </div>
    </div>

    <div class="nav-shadow"></div>
  </div>

  <div class="custom-css w-embed">
    <style>
      .scroll::-webkit-scrollbar {
        height: 4px;
      }

      .scroll::-webkit-scrollbar-track {
        background: transparent;
      }

      .scroll::-webkit-scrollbar-thumb {
        background: rgb(233, 229, 221);
        border-radius: 1000px;
      }
    </style>
  </div>
</section>
