<section class="section-3">
  <div class="container">
    <div class="content">
      <div class="content-wrap">
        <div class="group">
          <div class="w-form">
            <form
              [formGroup]="userForm"
              (ngSubmit)="onSubmit()"
              id="email-form"
              name="email-form"
              data-name="Email Form"
              method="get"
              data-wf-page-id="65a13365de81b401ac205186"
              data-wf-element-id="bbd9dab3-04e9-18b9-f6b4-9b312de32dc7"
            >
              <div class="w-layout-grid grid-8">
                <div
                  id="w-node-_459b960d-ce15-c6e4-2d77-8c8da4e753be-ac205186"
                  class="add-user-admin-div"
                >
                  <label for="field-2" class="add-label">User Role</label
                  ><input
                    class="add-user-input w-input"
                    maxlength="256"
                    name="field-2"
                    data-name="Field 2"
                    placeholder="Enter your First name"
                    type="text"
                    id="field-2"
                    required=""
                    formControlName="userrole"
                    readonly
                  />
                </div>
                
                <div
                  id="w-node-_459b960d-ce15-c6e4-2d77-8c8da4e753be-ac205186"
                  class="add-user-admin-div"
                >
                  <label for="field-2" class="add-label">Full Name</label
                  ><input
                    class="add-user-input w-input"
                    maxlength="256"
                    name="field-2"
                    data-name="Field 2"
                    placeholder="Enter your First name"
                    type="text"
                    id="field-2"
                    required=""
                    formControlName="fullname"
                  />
                </div>     

                <div
                  id="w-node-_4cd953d6-568c-454e-fa45-d438d47d0757-ac205186"
                  class="add-user-admin-div"
                >
                  <label for="field-3" class="add-label">Email Address</label
                  ><input
                    class="add-user-input w-input"
                    maxlength="256"
                    name="field-2"
                    data-name="Field 2"
                    placeholder="Enter your User name"
                    type="text"
                    id="field-2"
                    required=""
                    formControlName="email"
                  />
                </div>

                <div
                id="w-node-_4cd953d6-568c-454e-fa45-d438d47d0757-ac205186"
                class="add-user-admin-div status-div"
                >
                  <label for="field-3" class="add-label">Active Status</label
                  >
                  <!-- <select
                    formControlName="UserSubscriptionStatus"
                    id="field"
                    name="field"
                    data-name="Field"
                    class="add-user-input w-select"
                  >
                    <option value="">Select user subscription status</option>
                    <option value="true" >True</option>
                    <option value="false" >False</option>
                  </select> -->

                  <!-- <button
                    class="status"
                    type="button"
                    (click)="toggleSubscriptionStatus()"
                    >
                      <mat-icon 
                        style="font-size: 24px;" 
                        [style.color]="userForm.controls['UserSubscriptionStatus'].value ? 'green' : '#00386C'">
                          {{ userForm.controls['UserSubscriptionStatus'].value ? 'toggle_on' : 'toggle_off' }}
                      </mat-icon>
                    </button> -->

                    <mat-slide-toggle
                      hideIcon="true"
                      color="primary"
                      [checked]="userForm.controls['isactive'].value" 
                      (change)="toggleSubscriptionStatus()">
                  </mat-slide-toggle>
                </div>
              </div>
              <div class="div-block-435">
                <input (click)="onCancel();"
                  type="submit"
                  data-wait=""
                  class="cancel-button w-button"
                  value="Cancel"
                />
                <input
                  type="submit"
                  data-wait="Please wait..."
                  class="submit-button w-button"
                  value="Submit"
                />
              </div>
            </form>
            <!-- <div class="w-form-done">
              <div>Thank you! Your submission has been received!</div>
            </div>
            <div class="w-form-fail">
              <div>Oops! Something went wrong while submitting the form.</div>
            </div> -->
          </div>
        </div>
      </div>
    </div>
    <div
      data-w-id="bee8f17e-99cc-0f55-571f-7e62129d86d9"
      class="nav-shadow"
    ></div>
  </div>
  <div class="custom-css w-embed">
    <style>
      /*width*/
      .scroll::-webkit-scrollbar {
        height: 4px;
      }
      /*track*/
      .scroll::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0);
      }
      /*thumb*/
      .scroll::-webkit-scrollbar-thumb {
        background: rgb(233, 229, 221);
        border-radius: 1000px;
      }
    </style>
  </div>
</section>
